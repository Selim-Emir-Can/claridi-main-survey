 <p>Use <b>Save progress and pause</b> before taking a break. Keep the downloaded JSON file. To continue, reopen your assigned form and choose <b>Resume from JSON</b>, including on another computer. The file keeps completed answers and selections on your current page. At the end, download one final JSON file and email it to the study coordinator. Nothing is submitted automatically.</p>

 if(st==="exp"){app.innerHTML=`<div class="card"><h2>About you</h2>
 <div class="q"><b>Areas of expertise (select all that apply)</b>${checks("areas",[["neuroanatomy","Neuroanatomy / neuroscience"],["cardiac","Cardiac histology / cardiology"],["fluorescence","Fluorescence microscopy"],["clearing","Tissue clearing"],["pathology","Histopathology"],["computational","Computational imaging / machine learning"],["other","Other"]])}</div>
 <div class="q"><b>Current position</b>${radios("position",[["student","Student"],["phd","PhD student"],["postdoc","Postdoc / research scientist"],["faculty","Faculty / PI"],["clinician","Clinician / pathologist"],["technician","Technician / imaging staff"],["other","Other"]])}</div>

   S.meta.display={user_agent:navigator.userAgent,screen_w:screen.width,screen_h:screen.height,window_w:innerWidth,window_h:innerHeight,device_pixel_ratio:devicePixelRatio,

 if(st==="inst2"){app.innerHTML=`<div class="card"><h2>Part 1 of 2: single images</h2>
 <p>Each page shows one stained-looking image (displayed at 384 x 384 screen pixels). Answer all six questions, then press <b>Next</b>. You cannot go back.
 Some images are C&amp;SF references and some are virtual outputs; the unstained input is not shown.</p>
 ${innerWidth<820?'<div class="banner">Your window is narrow ('+innerWidth+' px). The survey works, but a desktop or laptop screen of at least 820 px width is recommended.</div>':""}
 <button id="go">Start Part 1</button></div>`;$("go").onclick=()=>{S.stage="b2";S.i=0;save();render()};return}
 if(st==="b2"){if(S.i>=B2.length){S.stage="mid";save();render();return}
  const x=B2[S.i];if(S.i+1<B2.length)preload([B2[S.i+1].i]);else if(B1.length)preload([B1[0].a,B1[0].b]);
  app.innerHTML=`<div class="card"><div class="mute small">Part 1 · image ${S.i+1} of ${B2.length} · ID: ${esc(x.t.split("-").pop())}</div>
  <div class="imgs" id="box"><figure><img src="${IMG}${x.i}.png" alt="image to evaluate" width="384" height="384"></figure></div>
  <div class="q"><b>Q1 · Nuclei plausibility</b>${radios("nuc",LMH)}</div>
  <div class="q"><b>Q2 · Membrane / structural plausibility</b>${radios("mem",LMH)}</div>
  <div class="q"><b>Q3 · Overall tissue architecture coherence</b>${radios("arc",LMH)}</div>
  <div class="q"><b>Q4 · Tissue type</b>${radios("tis",[["brain","Brain"],["cardiac","Cardiac"],["uncertain","Uncertain"]])}</div>
  <div class="q"><b>Q5 · Fibrous / vascular pattern detectable</b>${radios("fib",[["yes","Yes"],["no","No"],["uncertain","Uncertain"]])}</div>
  <div class="q"><b>Q6 · Does this image appear to be a C&amp;SF reference or a virtual output?</b>${radios("src",[["reference","C&amp;SF reference"],["virtual","Virtual output"],["cannot_tell","Cannot tell"]])}</div>

  let bad=false;whenLoaded($("box"),b=>{bad=b});

  $("nx").onclick=()=>{const im=document.querySelector("#box img");next(rec({block:2,trial:x.t,image:x.i,nuclei:val("nuc"),membrane:val("mem"),architecture:val("arc"),
   tissue_type:val("tis"),fibrous:val("fib"),source_response:val("src"),disp_px:Math.round(im.getBoundingClientRect().width),load_error:bad?1:0}))};return}
 if(st==="mid"){app.innerHTML=`<div class="card"><h2>Part 1 complete</h2><p>Part 2 starts next. Part 1 answers are now locked.
 This is the suggested end of the first session. To take a break, use <b>Save progress and pause</b> (bottom of the page) and keep the JSON file.</p><button id="go">Continue to Part 2</button></div>`;
  $("go").onclick=()=>{S.stage="inst1";save();render()};return}
 if(st==="inst1"){app.innerHTML=`<div class="card"><h2>Part 2 of 2: which image is the C&amp;SF reference?</h2>
 <p>Each trial shows two stained-looking images of the <b>same field</b>, labelled A and B. One is the chemically cleared-and-stained (C&amp;SF) reference,
 the other is a virtual output computed from an unstained image of that field. Choose the one you believe is the <b>C&amp;SF reference</b>, even if you have to guess,
 and say how confident you are. You will not be told whether you were right. A few trials are easy attention checks.</p>
 <button id="go">Start Part 2</button></div>`;$("go").onclick=()=>{S.stage="b1";S.i=0;S.meta.part2_started=new Date().toISOString();save();render()};return}
 if(st==="b1"){if(S.i>=B1.length){S.stage="post";S.meta.part2_finished=new Date().toISOString();save();render();return}
  const x=B1[S.i];if(S.i+1<B1.length)preload([B1[S.i+1].a,B1[S.i+1].b]);
  const brk=S.i===Math.ceil(B1.length/2)?`<div class="banner small">Suggested break point: ${S.i} of ${B1.length} pairs done. You may continue, or use <b>Save progress and pause</b> (bottom of the page).</div>`:"";
  app.innerHTML=`<div class="card">${brk}<div class="mute small">Part 2 · trial ${S.i+1} of ${B1.length} · ID: ${esc(x.t.split("-").pop())}</div>
  <div class="imgs" id="box"><figure><div class="lab">A</div><img src="${IMG}${x.a}.png" alt="image A" width="384" height="384"></figure>
  <figure><div class="lab">B</div><img src="${IMG}${x.b}.png" alt="image B" width="384" height="384"></figure></div>
  <div class="q"><b>Which image is the C&amp;SF reference?</b>${radios("ch",[["A","A"],["B","B"]])}</div>
  <div class="q"><b>How confident are you?</b>${radios("cf",[["1","1 · guessing"],["2","2"],["3","3"],["4","4 · certain"]])}</div>
  <button id="nx" disabled>Next</button></div>`;
  let bad=false;whenLoaded($("box"),b=>{bad=b});
  CHECK=()=>{$("nx").disabled=!(READY&&val("ch")&&val("cf"))};app.onchange=e=>{if(e.target.name==="ch"&&READY)choiceAt=performance.now();CHECK()};
  $("nx").onclick=()=>{const im=document.querySelector("#box img");next(rec({block:1,trial:x.t,img_A:x.a,img_B:x.b,choice:val("ch"),confidence:+val("cf"),
   choice_ms:choiceAt?Math.round(choiceAt-t0):null,disp_px:Math.round(im.getBoundingClientRect().width),load_error:bad?1:0}))};return}
 if(st==="post"){app.innerHTML=`<div class="card"><h2>Almost done: two optional questions</h2>
 <div class="q"><b>Which visual features, if any, did you use to decide which image was the reference?</b><textarea id="cues" maxlength="2000"></textarea></div>
 <div class="q"><b>Did you have any technical problems or other comments?</b><textarea id="cmt" maxlength="2000"></textarea></div>
 <button id="go">Finish</button></div>`;
  $("go").onclick=()=>{S.meta.cues=$("cues").value;S.meta.comments=$("cmt").value;S.meta.finished=new Date().toISOString();S.stage="done";save();render()};return}
 app.innerHTML=`<div class="card"><h2>All done. Thank you!</h2><p>You answered ${S.resp.length} of ${NTOT} items. Please download your answers as one JSON file and
 ${MODE==="pilot"?"keep them, or send them to the study coordinator if you were asked to test the pilot.":MODE==="review"?"keep them (review copy, not study data).":"send the file to the study coordinator by e-mail."}</p>
 <p><button id="djson">Download JSON</button></p>
 <p class="small mute">If the download does not start (for example on some phones), use "Show as text" at the bottom of the page and copy the text into an e-mail.</p>
 ${MODE!=="main"?'<p><button class="sec" id="restart">Restart this '+MODE+' form (deletes answers in this browser)</button></p>':""}</div>`;
 $("djson").onclick=()=>download("json");
 if(MODE!=="main")$("restart").onclick=()=>{if(confirm("Delete all answers of this "+MODE+" form in this browser?")){try{localStorage.removeItem(KEY)}catch(e){}location.reload()}}}
const COLS=["reader","mode","build","block","trial","image","img_A","img_B","nuclei","membrane","architecture","tissue_type","fibrous","source_response","choice","confidence","rt_ms","choice_ms","hidden_ms","disp_px","load_error","answered_at"];
function payload(kind){capturePending();const meta=Object.assign({reader:READER,mode:MODE,build:BUILD,form_version:FORM_VERSION,n_items:NTOT,n_answered:S.resp.length,stage:S.stage,exported_at:new Date().toISOString()},S.meta);
 if(kind==="json")return JSON.stringify({format:"claridi-reader-study-v3",reader:READER,mode:MODE,build:BUILD,meta:meta,responses:S.resp,resume:{version:1,form_version:FORM_VERSION,state:S}},null,1);
 const q=v=>v==null?"":(/[",\n\r]/.test(String(v))?'"'+String(v).replace(/"/g,'""')+'"':String(v));
 return ["# meta: "+JSON.stringify(meta),COLS.join(",")].concat(S.resp.map(r=>COLS.map(c=>q(r[c])).join(","))).join("\n")+"\n"}
function download(kind){if(BLOCKED)return;const txt=payload(kind),fn=`claridi_reader_${READER}_${BUILD}_responses.${kind}`;
 try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:kind==="csv"?"text/csv":"application/json"}));a.download=fn;document.body.appendChild(a);a.click();a.remove()}
 catch(e){showText(kind)}}
function showText(kind){if(BLOCKED)return;const d=$("dump");d.style.display="block";d.value=payload(kind||"json");d.focus();d.select()}
$("fjson").onclick=()=>download("json");$("fshow").onclick=()=>showText("json");
function capturePending(){
 if(S.paused||BLOCKED)return;
 const controls=[...app.querySelectorAll("input,textarea")].map(e=>({id:e.id,name:e.name,type:e.type,value:e.value,checked:e.checked}));
 const prev=S.pending, same=prev&&prev.stage===S.stage&&prev.i===S.i;
 const now=performance.now();
 S.pending={stage:S.stage,i:S.i,controls,elapsed:READY?Math.max(0,now-t0):(same?prev.elapsed:0),hidden:READY?hidden+(hidAt===null?0:now-hidAt):(same?prev.hidden:0),choice:READY?(choiceAt===null?null:choiceAt-t0):(same?prev.choice:null)};
 save();
}
function restorePending(){
 if(S.paused)return;
 const d=S.pending;if(!d||d.stage!==S.stage||d.i!==S.i)return;
 for(const e of app.querySelectorAll("input,textarea")){
 const v=d.controls.find(v=>v.id===e.id&&v.name===e.name&&v.type===e.type&&(!["radio","checkbox"].includes(e.type)||v.value===e.value));
 if(v){if(["radio","checkbox"].includes(e.type))e.checked=!!v.checked;else e.value=v.value;}
 }
 app.dispatchEvent(new Event("input"));app.dispatchEvent(new Event("change"));CHECK();setupAnswerShortcuts();
}
function validateResume(j){
 const fail=m=>{throw new Error(m)};
 if(!j||j.format!=="claridi-reader-study-v3"||j.reader!==READER||j.mode!==MODE||j.build!==BUILD)fail("This file belongs to a different reader or study build. Open your assigned form.");
 if(j.resume?.version!==1||j.resume.form_version!==FORM_VERSION)fail("This file was not saved by this version of the resumable form.");
 const q=j.resume.state;
 if(!q||q.reader!==READER||q.mode!==MODE||q.build!==BUILD||!q.meta||q.meta.constructor!==Object||!Array.isArray(q.resp)||!Number.isInteger(q.i))fail("Invalid progress file.");
 if(JSON.stringify(q.resp)!==JSON.stringify(j.responses))fail("Inconsistent response data.");
 const before=["intro","elig","exp","inst2"],between=["mid","inst1"],after=["post","done"];
 let count;
 if(before.includes(q.stage)){count=0;if(q.i!==0)fail("Invalid position.");}
 else if(q.stage==="b2"){if(q.i<0||q.i>B2.length)fail("Invalid position.");count=q.i;}
 else if(between.includes(q.stage)){count=B2.length;if(q.i!==B2.length)fail("Invalid position.");}
 else if(q.stage==="b1"){if(q.i<0||q.i>B1.length)fail("Invalid position.");count=B2.length+q.i;}
 else if(after.includes(q.stage)){count=NTOT;if(q.i!==B1.length)fail("Invalid position.");}
 else fail("Invalid survey stage.");
 if(q.resp.length!==count)fail("Answer count does not match progress.");
 const trials=[...B2,...B1];q.resp.forEach((r,k)=>{
 const t=trials[k];if(r.trial!==t.t||r.reader!==READER||r.build!==BUILD||r.mode!==MODE||r.block!==(k<B2.length?2:1))fail("Responses do not match this form's item order.");
 if(k<B2.length?r.image!==t.i:(r.img_A!==t.a||r.img_B!==t.b))fail("Image assignments do not match.");
 if(!Number.isFinite(r.rt_ms)||r.rt_ms<0||!Number.isFinite(r.hidden_ms)||r.hidden_ms<0)fail("Invalid timing data.");
 });
 if(q.pending){const d=q.pending;if(d.stage!==q.stage||d.i!==q.i||!Array.isArray(d.controls)||d.controls.length>100||![d.elapsed,d.hidden].every(x=>Number.isFinite(x)&&x>=0)||(d.choice!==null&&(!Number.isFinite(d.choice)||d.choice<0)))fail("Invalid partial-page data.");}
 if(q.resp.length<S.resp.length)fail("This backup is older than the progress already in this browser. Use your newest file.");
 for(let k=0;k<S.resp.length;k++)if(JSON.stringify(S.resp[k])!==JSON.stringify(q.resp[k]))fail("This backup conflicts with answers already saved in this browser.");
 return q;
}
$("pause").onclick=()=>{if(BLOCKED)return;capturePending();S.paused=true;save();if(BLOCKED)return;download("json");render()};
$("restore").onchange=async e=>{
 const f=e.target.files[0];if(!f)return;
 try{if(f.size>10000000)throw new Error("Please select a study JSON file smaller than 10 MB.");
 let j;try{j=JSON.parse(await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result));r.onerror=()=>no(r.error);r.readAsText(f)}))}catch(_){throw new Error("This is not a valid study JSON file (it may be damaged or incomplete).")}
 try{const cur=stored();if(cur&&cur.build===BUILD&&(cur.rev||0)!==REV){block();return}}catch(_){}
 const q=validateResume(j);
 if(!confirm("Load this backup with "+q.resp.length+" completed items?"))return;
 S=q;S.rev=REV;S.paused=true;S.meta.resume_events=S.meta.resume_events||[];S.meta.resume_events.push({at:new Date().toISOString(),completed:S.resp.length,window_w:innerWidth,window_h:innerHeight,user_agent:navigator.userAgent});
 save();render();$("restoremsg").textContent="Progress loaded. Choose Continue survey when ready.";
 }catch(err){$("restoremsg").textContent="Could not load progress: "+err.message;}finally{e.target.value="";}
};
app.addEventListener("input",capturePending);app.addEventListener("change",capturePending);
window.addEventListener("pagehide",capturePending);

// Answer shortcuts apply only to image-rating pages, never consent or text entry.
let hotGroup=null;
function answerGroups(){return [...app.querySelectorAll('.q')].filter(q=>q.querySelector('input[type="radio"]'));}
function highlightAnswer(q){hotGroup=q;for(const group of answerGroups()){group.classList.toggle('hot-active',group===q);} }
function setupAnswerShortcuts(){
 document.getElementById('hotkey-help')?.remove();
 hotGroup=null;app.classList.toggle('shortcuts-enabled',['b1','b2'].includes(S.stage)&&!S.paused);
 if(!app.classList.contains('shortcuts-enabled'))return;
 const help=document.createElement('p');help.className='small mute';help.id='hotkey-help';help.textContent='Keyboard: use number keys for the highlighted question. The highlight moves to the next unanswered question. Click or Tab to revisit a question on this page. Press Enter when all answers are selected to go to the next item.';
 app.querySelector('.card').prepend(help);
 highlightAnswer(answerGroups().find(q=>!q.querySelector('input:checked'))||answerGroups()[0]);
}
app.addEventListener('focusin',e=>{const q=e.target.closest('.q');if(q&&answerGroups().includes(q))highlightAnswer(q);});
app.addEventListener('pointerdown',e=>{const q=e.target.closest('.q');if(q&&answerGroups().includes(q))highlightAnswer(q);});
app.addEventListener('change',e=>{
 if(!app.classList.contains('shortcuts-enabled')||e.target.type!=='radio')return;
 const groups=answerGroups(),q=e.target.closest('.q'),i=groups.indexOf(q);
 const next=groups.slice(i+1).concat(groups.slice(0,i)).find(g=>!g.querySelector('input:checked'));
 highlightAnswer(next||q);
});
document.addEventListener('keydown',e=>{
 if(e.repeat||e.isComposing||e.ctrlKey||e.altKey||e.metaKey||e.shiftKey||!app.classList.contains('shortcuts-enabled'))return;
 const target=e.target;
 if(target.isContentEditable||target.closest('[contenteditable="true"]')||target.matches('textarea,select,input:not([type="radio"]):not([type="checkbox"])'))return;
 if(target!==document.body&&target!==document.documentElement&&!app.contains(target))return;
 if(e.key==='Enter'){
  if(target.closest('button,a'))return;
  e.preventDefault();const next=$('nx');if(READY&&next&&!next.disabled)next.click();return;
 }
 if(!/^[1-9]$/.test(e.key)||!READY||!hotGroup)return;
 const option=hotGroup.querySelectorAll('input[type="radio"]')[Number(e.key)-1];if(!option||option.disabled)return;
 e.preventDefault();option.checked=true;option.dispatchEvent(new Event('change',{bubbles:true}));
});

render();
